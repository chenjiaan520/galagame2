<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RenYuki: 纯爱物语</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-bg: #fff0f5;
        --color-primary: #ff85a2;
        --color-secondary: #7afcff;
        --color-text: #4a4a4a;
        --glass-bg: rgba(255, 255, 255, 0.85);
      }
      body {
        font-family: 'M PLUS Rounded 1c', 'Nunito', sans-serif;
        background-color: var(--color-bg);
        background-image: 
          radial-gradient(#ffcce0 15%, transparent 16%),
          radial-gradient(#ffcce0 15%, transparent 16%);
        background-size: 30px 30px;
        background-position: 0 0, 15px 15px;
        color: var(--color-text);
        overflow: hidden;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.5); 
      }
      ::-webkit-scrollbar-thumb {
        background: #ffb7c5; 
        border-radius: 10px;
      }
      
      /* Anime Aesthetics */
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        border: 2px solid #ffffff;
        box-shadow: 0 8px 32px rgba(255, 133, 162, 0.15);
        border-radius: 24px;
      }
      
      .anime-input {
        background: #fff;
        border: 2px solid #ffd1dc;
        border-radius: 12px;
        padding: 10px 15px;
        transition: all 0.3s ease;
        color: #555;
      }
      .anime-input:focus {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 4px rgba(255, 133, 162, 0.2);
        outline: none;
      }

      /* Animations */
      @keyframes float-soft {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pop-in {
        0% { opacity: 0; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      .animate-float {
        animation: float-soft 4s ease-in-out infinite;
      }
      .animate-pop {
        animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      }
      .animate-fadeIn {
        animation: fade-in 0.8s ease-out forwards;
      }

      /* Landscape Enforcement */
      #landscape-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #ffecf2;
        color: #ff85a2;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      @media screen and (orientation: portrait) {
        #landscape-overlay {
          display: flex;
        }
        #root {
          display: none;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
</head>
  <body>
    <!-- Mobile Portrait Warning -->
    <div id="landscape-overlay">
      <div class="text-6xl mb-4">📱↻</div>
      <h2 class="text-xl font-bold">请横屏食用哦 ~</h2>
      <p class="mt-2 text-sm opacity-70">Landscape Required for Best Experience</p>
    </div>

    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
